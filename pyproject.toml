[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "houdini-mcp"
version = "1.0.0"
description = "MCP server for SideFX Houdini integration via rpyc"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["houdini", "mcp", "model-context-protocol", "3d", "vfx", "procedural"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=4.1",
    # Held below 6: the 6.0.2 client fails against Houdini's bundled rpyc 4.1.0
    # with `invalid message type: 18` (verified 2026-10-11, Houdini 22.0.466).
    "rpyc>=5.3.1,<6",
    # For get_houdini_help web scraping
    "requests>=2.34",
    "beautifulsoup4>=4.15",
    # Imported directly (server.py); not left to fastmcp's transitive set
    "starlette>=1.7",
    # tools/summarization.py calls Claude through the official SDK: CredentialsError
    # (1.5), output_config (1.x), and ModelInfo.lifecycle (1.12) must exist.
    "anthropic>=1.12",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-cov>=7",
    "pytest-asyncio>=1.4",
    # Property-based / stateful tests (outbound WSS state-machine core,
    # execute_code safety-rail evasion fuzzing).
    "hypothesis>=6.169",
    # Formatter output is stable within a minor; the next minor is a deliberate reformat, not a lock refresh.
    "ruff>=0.17,<0.18",
    "mypy>=2.4",
    "types-requests",
    "pre-commit>=4.6",
    "bandit[toml]>=1.9",
    # `twine check` on the wheel/sdist in the CI build job
    "twine>=7",
    # tests/test_summarization.py drives the SDK over a MockTransport; not left to anthropic's transitive set
    "httpx2>=2.13",
]

[tool.uv]
# The one declaration of the uv line this lock is written by. setup-uv reads it
# (no version-file input needed) and uv refuses to run outside it, so the Docker
# image tag below either matches this or fails the build.
# Held on 0.12: 0.13.0 shipped 2026-10-09 and the uv this repo is developed with is 0.12.15.
required-version = "~=0.12.15"

[project.urls]
Homepage = "https://github.com/oculairmedia/houdini-mcp"
Repository = "https://github.com/oculairmedia/houdini-mcp"
Issues = "https://github.com/oculairmedia/houdini-mcp/issues"

[project.scripts]
houdini-mcp = "houdini_mcp.server:run_server"

[tool.setuptools.packages.find]
# houdini_mcp_handshake is defined once, in the plugin tree (Houdini's path), and
# ships in this distribution from that same source. The plugin itself does not.
where = [".", "houdini_plugin/python"]
include = ["houdini_mcp*"]
exclude = ["houdini_mcp_plugin*"]

# Ruff configuration (replaces black, isort, flake8)
[tool.ruff]
line-length = 100
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.per-file-target-version]
# Runs inside Houdini's embedded interpreter, not under requires-python
"houdini_plugin/**" = "py310"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # do not perform function calls in argument defaults
    "ARG001", # unused function argument (common in interfaces)
    "ARG002", # unused method argument (common in interface methods and pytest fixtures)
    "SIM105", # intentional try/except/pass defensive guards around optional Houdini APIs (see bandit B110)
]

[tool.ruff.lint.per-file-ignores]
# _common.py deliberately groups imports under section headers (e.g. parallel
# execution utilities) rather than at the top of the module.
"houdini_mcp/tools/_common.py" = ["E402"]  # module-import-not-at-top-of-file

[tool.ruff.lint.isort]
known-first-party = ["houdini_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# Pytest configuration
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "integration: requires a live Houdini hrpyc server",
]

# Coverage configuration
[tool.coverage.run]
source = ["houdini_mcp"]
branch = true
omit = [
    "*/tests/*",
    "*/__main__.py",
    "*/server.py",  # FastMCP registration - tested via integration tests
    "*/tools/_common.py",  # Shared utilities - will be used in Phase 2
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# CI runs the unit subset only (`-m 'not integration'`, since integration
# tests need a live Houdini), which currently covers ~55%. Floor is set below
# that to catch real regressions without failing on the integration gap; raise
# it as unit coverage grows.
fail_under = 50
show_missing = true

# Mypy configuration
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_strict_optional = true
exclude = ["tests/", "build/"]

# Bandit security configuration
[tool.bandit]
exclude_dirs = ["tests", "build", "dist"]
# Each skip below is an intentional, non-actionable pattern in this codebase:
#   B101 - assert statements are fine in tests
#   B102 - exec: executing Houdini Python is the core purpose of the execute_code tool
#   B104 - hardcoded_bind_all_interfaces: the 0.0.0.0 HTTP bind in server.py is intentional
#   B110 - try_except_pass: defensive guards around optional Houdini (hou) APIs
#   B112 - try_except_continue: defensive guards that skip failed items in render loops
#   B311 - non-crypto random: used for jitter/ids, never for security
skips = ["B101", "B102", "B104", "B110", "B112", "B311"]
