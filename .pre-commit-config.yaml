# Pre-commit hooks for houdini-mcp
# Install with: uv sync && uv run pre-commit install

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-docstring-first

  # Project tools run from the uv environment, so their versions come from
  # uv.lock - the same ones CI runs - instead of a second pin here.
  - repo: local
    hooks:
      - id: ruff
        name: ruff
        entry: uv run --locked ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff-format
        entry: uv run --locked ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run --locked mypy
        language: system
        types: [python]
        exclude: ^tests/
      - id: bandit
        name: bandit
        entry: uv run --locked bandit -c pyproject.toml -r houdini_mcp/
        language: system
        pass_filenames: false
        types: [python]
      - id: pytest-check
        name: pytest
        entry: uv run --locked pytest tests/ -x -q --tb=short
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
        stages: [pre-push]  # Only run on push, not every commit

ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit hooks
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: [ruff, ruff-format, mypy, bandit, pytest-check]  # need uv; GitHub Actions runs them
