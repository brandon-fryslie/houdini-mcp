services:
  houdini-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: houdini-mcp:local
    container_name: houdini-mcp
    restart: unless-stopped
    ports:
      - "3055:3055"
    environment:
      - HOUDINI_HOST=${HOUDINI_HOST:?set HOUDINI_HOST in .env to the address of the machine running Houdini}
      - HOUDINI_PORT=${HOUDINI_PORT:-18811}
      - HOUDINI_RPC_TOKEN=${HOUDINI_RPC_TOKEN:-}
      - MCP_PORT=${MCP_PORT:-3055}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3055/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
