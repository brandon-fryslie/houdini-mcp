services:
  houdini-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: houdini-mcp:local
    container_name: houdini-mcp
    restart: unless-stopped
    # MCP_HOST is the address on this machine the server answers at, as under `uv run`:
    # compose publishes there. Inside, the server listens on all of the container's own
    # interfaces, which nothing reaches but that publish.
    ports:
      - "${MCP_HOST:-127.0.0.1}:3055:3055"
    # Every setting the server reads. A bare name takes its value from the shell or the
    # env file and is left unset when neither sets it, so the server's own default applies.
    environment:
      - HOUDINI_HOST=${HOUDINI_HOST:?set HOUDINI_HOST in .env to the address of the machine running Houdini}
      - HOUDINI_PORT
      - HOUDINI_RPC_TOKEN
      - HOUDINI_MCP_ALLOW_BYPASS
      - HOUDINI_MCP_RESULTS_DIR
      - MCP_HOST=0.0.0.0
      - MCP_PORT
      - MCP_ALLOWED_HOSTS
      - MCP_TRANSPORT
      - LOG_LEVEL
      - SUMMARIZATION_ENABLED
      - SUMMARIZATION_BASE_URL
      - SUMMARIZATION_API_KEY
      - SUMMARIZATION_MODEL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3055/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
