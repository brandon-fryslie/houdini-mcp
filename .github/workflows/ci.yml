name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Check formatting with Ruff
        run: uv run ruff format --check .

      - name: Lint with Ruff
        run: uv run ruff check .

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/ -v -m 'not integration' --cov=houdini_mcp --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: py${{ matrix.python-version }}
          fail_ci_if_error: false

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Run mypy
        run: uv run mypy

      # The plugin runs in Houdini's embedded Python, 3.10 among them: ruff's
      # py310 target checks syntax, not what typing and the stdlib export.
      - name: Run mypy on the plugin as Python 3.10
        run: uv run mypy --python-version 3.10 houdini_plugin/houdini_mcp/python

      # The installer's Windows branch is unreachable to a check run as Linux.
      - name: Run mypy on the installer as Windows
        run: uv run mypy --platform win32 houdini_mcp/install.py

  # Where the installer puts the plugin on Windows is Windows' answer, asked of Windows:
  # Documents redirected and not yet made, as OneDrive leaves it, then a user's HOME.
  # Each run has HOME set as Git Bash sets it, which a Houdini from the Start menu never sees.
  windows-houdini-home:
    name: Houdini's home on Windows
    runs-on: windows-latest
    env:
      HOME: C:\GitBashHome
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Redirect Documents
        run: |
          Set-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders' Personal "$env:RUNNER_TEMP\OneDrive\Documents"
          $documents = [Environment]::GetFolderPath('MyDocuments', 'DoNotVerify')
          if ($documents -ne "$env:RUNNER_TEMP\OneDrive\Documents") { throw "Documents is $documents" }

      - name: Houdini's home is the redirected Documents
        run: uv run pytest tests/test_install.py -v -k houdinis_home_is_the_one_windows_gives

      - name: Set a HOME for the user
        run: '[Environment]::SetEnvironmentVariable("HOME", "$env:RUNNER_TEMP\UserHome", "User")'

      - name: Houdini's home is the user's HOME
        run: uv run pytest tests/test_install.py -v -k houdinis_home_is_the_one_windows_gives

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Run Bandit
        run: uv run bandit -r houdini_mcp/ -c pyproject.toml

  build:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Build package
        run: uv build

      - name: Check package
        run: uv run twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: houdini-mcp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The image ships the modules the server shares with the plugin from the plugin
      # tree; a server that cannot import them fails here, not in a published container.
      - name: Import the server in the image
        run: docker run --rm houdini-mcp:${{ github.sha }} python -c "import houdini_mcp.server"
